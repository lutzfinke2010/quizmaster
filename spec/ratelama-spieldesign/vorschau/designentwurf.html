<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuizRush – Spielablauf Designentwurf</title><style>body{margin:0;padding:24px;background:#f1f3ed}main{max-width:1100px;margin:auto}</style></head><body><main><div id="qr-concept">
 <div class="preview-controls" aria-label="Spielphase im Entwurf"><span>DESIGNENTWURF · BEISPIELRUNDE</span><div><button data-phase="question" aria-pressed="true">Frage</button><button data-phase="waiting" aria-pressed="false">Abgegeben</button><button data-phase="reveal" aria-pressed="false">Auflösung</button><button data-phase="ranking" aria-pressed="false">Rangliste</button></div></div>
 <div class="views">
  <section class="stage-wrap"><div class="view-label">GEMEINSAMER BILDSCHIRM</div><div class="stage">
   <header><div class="brand"><span class="brand-icon">✳</span> QuizRush</div><span class="live">● LIVE · TEAMABEND</span></header>
   <div id="stage-content" aria-live="polite"></div>
   <footer><span>SPIELCODE <b>482 619</b></span><span>Einfach. Zusammen. Spielen.</span></footer>
  </div></section>
  <section class="phone-wrap"><div class="view-label">SMARTPHONE · MITSPIELEN</div><div class="phone"><header><div class="brand">✳ QuizRush</div><span>● Live</span></header><div class="player"><span class="avatar">🐨</span><div>Neugieriger Koala<small>Platz 4 · 2.450 Punkte</small></div></div><div id="phone-content" aria-live="polite"></div><div class="phone-footer">Runde mit 24 Mitspielenden</div></div></section>
 </div>
</div>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700;800;900&display=swap');
#qr-concept{--paper:#f8f8f0;--ink:#203e37;--green:#205c4e;--lime:#daf18e;--peach:#f8d3bb;--lilac:#e6def6;--soft:#eaf0df;--line:#cdd6c8;--secondary:#586c64;font:15px 'DM Sans',sans-serif;color:var(--ink);color-scheme:light;width:100%}#qr-concept *{box-sizing:border-box}#qr-concept button{font:inherit;cursor:pointer}#qr-concept button:focus-visible{outline:3px solid #784ed0;outline-offset:4px}#qr-concept .preview-controls{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin:4px 0 24px;font-size:11px;font-weight:700;letter-spacing:1px}#qr-concept .preview-controls>div{display:flex;gap:4px;flex-wrap:wrap}#qr-concept .preview-controls button{border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:10px 12px;border-radius:9px;letter-spacing:0;font-size:13px}#qr-concept .preview-controls button[aria-pressed=true]{background:var(--green);color:var(--paper);border-color:var(--green)}#qr-concept .views{display:grid;grid-template-columns:minmax(0,1fr) 286px;gap:24px;align-items:start}#qr-concept .view-label{font-size:10px;letter-spacing:1.6px;font-weight:700;margin:0 0 10px;color:var(--secondary)}#qr-concept .stage{background:var(--paper);border:1px solid var(--line);border-radius:22px;overflow:hidden;min-height:600px;display:flex;flex-direction:column}#qr-concept header{display:flex;align-items:center;justify-content:space-between;gap:10px}#qr-concept .stage header{padding:22px 26px;border-bottom:1px solid var(--line)}#qr-concept .brand{font:800 23px 'Outfit',sans-serif;letter-spacing:-1px;display:flex;align-items:center;gap:9px}#qr-concept .brand-icon{background:var(--lime);border:1.5px solid var(--ink);border-radius:10px;display:inline-grid;place-items:center;width:34px;height:34px;transform:rotate(-8deg)}#qr-concept .live{font-size:10px;letter-spacing:.8px;font-weight:700;color:var(--green)}#qr-concept #stage-content{padding:30px 30px 28px;flex:1}#qr-concept .meta{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:1.4px;font-weight:700}#qr-concept .timer{display:grid;place-items:center;width:56px;height:56px;border:4px solid var(--green);border-radius:50%;font:700 22px 'Outfit',sans-serif;letter-spacing:-.5px}#qr-concept .eyebrow{font-size:11px;font-weight:700;letter-spacing:1.3px;color:var(--green)}#qr-concept h2{font:800 clamp(27px,3.5vw,42px)/1.1 'Outfit',sans-serif;letter-spacing:-1.3px;margin:20px 0 28px;text-wrap:balance}#qr-concept .highlight{background:linear-gradient(transparent 76%,var(--lime) 76%)}#qr-concept .answer-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}#qr-concept .answer{border:1.5px solid #a2b3a6;border-radius:13px;padding:17px 15px;display:flex;align-items:center;gap:12px;color:var(--ink);background:#fffefa;min-height:69px;text-align:left;font:700 19px 'Outfit',sans-serif;width:100%}#qr-concept .letter{display:grid;place-items:center;width:30px;height:30px;border:1px solid #b1c0b3;border-radius:8px;font:700 12px 'DM Sans',sans-serif;flex-shrink:0}#qr-concept .answer.correct,#qr-concept .answer.selected{background:var(--green);color:var(--paper);border-color:var(--green);box-shadow:3px 4px 0 var(--lime)}#qr-concept .answer.correct .letter,#qr-concept .answer.selected .letter{border-color:#83a797}#qr-concept .answer .check{margin-left:auto}#qr-concept .answer.dim{opacity:.6}#qr-concept .status{display:flex;justify-content:space-between;gap:8px;margin-top:30px;font-size:12px;color:var(--secondary)}#qr-concept .track{height:7px;background:#e2e8d9;border-radius:5px;margin-top:10px;overflow:hidden}#qr-concept .track span{display:block;height:100%;background:var(--green);border-radius:5px}#qr-concept .stage footer{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:18px 26px;border-top:1px solid var(--line);font-size:10px;color:var(--secondary)}#qr-concept .stage footer b{font-size:13px;letter-spacing:2px;color:var(--ink);margin-left:8px}#qr-concept .phone{border:5px solid var(--ink);border-radius:30px;padding:21px 16px 16px;background:var(--paper);min-height:600px;display:flex;flex-direction:column;box-shadow:5px 7px 0 var(--soft)}#qr-concept .phone header{padding-bottom:18px}#qr-concept .phone .brand{font-size:19px}#qr-concept .phone header>span{font-size:10px;color:var(--green)}#qr-concept .player{display:flex;align-items:center;gap:9px;font-size:12px;font-weight:700;padding:13px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}#qr-concept .avatar{display:grid;place-items:center;background:var(--lilac);border-radius:50%;width:36px;height:36px;font-size:23px;flex-shrink:0}#qr-concept small{display:block;font-size:10px;color:var(--secondary);font-weight:400;margin-top:3px}#qr-concept #phone-content{flex:1;padding-top:20px}#qr-concept .phone h2{font-size:25px;line-height:1.12;margin:15px 0 20px;letter-spacing:-.7px}#qr-concept .phone .meta{font-size:10px;letter-spacing:.5px}#qr-concept .phone .answer-grid{grid-template-columns:1fr;gap:10px}#qr-concept .phone .answer{font-size:16px;min-height:53px;padding:10px 12px}#qr-concept .phone .letter{width:26px;height:26px}#qr-concept .phone-footer{text-align:center;font-size:10px;color:var(--secondary);padding-top:20px}#qr-concept .hint{font-size:11px;color:var(--secondary);text-align:center;margin:17px 0 0}#qr-concept .result-note{font-size:13px;line-height:1.6;color:var(--secondary);margin-top:24px}#qr-concept .big-symbol{display:grid;place-items:center;background:var(--lime);border:1.5px solid var(--ink);width:80px;height:80px;font:700 42px 'Outfit',sans-serif;border-radius:23px;transform:rotate(-7deg);margin:28px auto 25px;box-shadow:4px 4px 0 var(--ink)}#qr-concept .center{text-align:center}#qr-concept .phone .center h2{font-size:31px}#qr-concept .points{font:800 45px 'Outfit',sans-serif;letter-spacing:-2px;color:var(--green)}#qr-concept .tag{display:inline-block;background:var(--soft);border-radius:30px;padding:8px 12px;font-size:11px;margin-top:12px}#qr-concept .podium{display:flex;align-items:end;justify-content:center;gap:10px;margin:24px 0 22px}#qr-concept .winner{width:32%;text-align:center;font-size:11px}#qr-concept .winner .animal{font-size:30px;display:block;margin-bottom:8px}#qr-concept .winner b{font:700 14px 'Outfit',sans-serif;display:block;overflow-wrap:anywhere}#qr-concept .pedestal{background:var(--lilac);height:65px;border-radius:12px 12px 0 0;display:grid;place-items:center;font:800 30px 'Outfit',sans-serif;margin-top:12px}#qr-concept .winner.first .pedestal{height:100px;background:var(--lime)}#qr-concept .winner.third .pedestal{height:45px;background:var(--peach)}#qr-concept .rank-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px;border-radius:12px;background:var(--soft);font-size:12px}#qr-concept .up{color:var(--green);font-weight:700}#qr-concept .phone .rank-row{padding:12px 9px;font-size:11px;margin-top:10px}#qr-concept .phone .result-note{font-size:12px}#qr-concept .phone .points{font-size:45px}#qr-concept .phone .big-symbol{width:70px;height:70px;font-size:32px}#qr-concept .results-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}#qr-concept .result-option{background:var(--soft);border-radius:12px;padding:15px;font-size:14px}#qr-concept .result-option.good{background:var(--green);color:var(--paper)}#qr-concept .result-option>div{display:flex;justify-content:space-between;gap:10px}#qr-concept .result-option .track{background:#d8e0d0}#qr-concept .result-option.good .track{background:#4b7b69}#qr-concept .result-option.good .track span{background:var(--lime)}#qr-concept .results-grid .track{height:5px}#qr-concept .phone .answer:disabled{cursor:default}#qr-concept .phone .picked{border:1px solid var(--line);background:var(--soft);border-radius:12px;padding:16px;text-align:center;font-size:13px;margin-top:20px}
@media(max-width:780px){#qr-concept .views{grid-template-columns:1fr}#qr-concept .phone-wrap{max-width:360px;width:100%;justify-self:center}#qr-concept .stage{min-height:520px}}@media(max-width:420px){#qr-concept .stage header{padding:18px}#qr-concept #stage-content{padding:22px 18px}#qr-concept .answer-grid,#qr-concept .results-grid{grid-template-columns:1fr}#qr-concept .stage footer>span:last-child{display:none}#qr-concept .live{font-size:9px}#qr-concept .brand{font-size:20px}}
</style>
<script>
(()=>{const root=document.getElementById('qr-concept');let phase='question',selection=null;const labels=['Mars','Saturn','Venus','Merkur'];const letters=['A','B','C','D'];const question='Welcher Planet ist für seine <span class="highlight">Ringe</span> bekannt?';
function options(phone){return '<div class="answer-grid">'+labels.map((name,i)=>'<'+(phone?'button type="button"':'div')+' class="answer" '+(phone?'data-answer="'+i+'"':'')+'><span class="letter">'+letters[i]+'</span>'+name+'</'+(phone?'button':'div')+'>').join('')+'</div>'}
function render(){root.querySelectorAll('[data-phase]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.phase===phase)));const stage=root.querySelector('#stage-content'),phone=root.querySelector('#phone-content');
if(phase==='question'||phase==='waiting'){stage.innerHTML='<div class="meta"><span>FRAGE 3 VON 10 · WELTRAUM</span><span class="timer">18</span></div><h2>'+question+'</h2>'+options(false)+'<div class="status"><span><b>'+(phase==='waiting'?'19':'18')+' von 24</b> haben geantwortet</span><span>Noch 18 Sekunden</span></div><div class="track"><span style="width:78%"></span></div>';phone.innerHTML=phase==='question'?'<div class="meta"><span>FRAGE 3 / 10</span><span>◷ 18 s</span></div><h2>'+question+'</h2>'+options(true)+'<p class="hint">Tippen und Antwort abgeben</p>':'<div class="center"><div class="big-symbol">✓</div><div class="eyebrow">ANTWORT IST DRIN</div><h2>Daumen sind gedrückt.</h2><p class="result-note">Gleich erfährst du, ob du richtig liegst.</p><div class="picked">Deine Antwort<br><b>'+letters[selection??1]+' · '+labels[selection??1]+'</b></div><span class="tag">19 von 24 haben geantwortet</span></div>'}
if(phase==='reveal'){stage.innerHTML='<div class="eyebrow">FRAGE 3 · AUFLÖSUNG</div><h2>Ein klarer Fall für <span class="highlight">Saturn.</span></h2><div class="results-grid">'+labels.map((name,i)=>'<div class="result-option '+(i===1?'good':'')+'"><div><b>'+letters[i]+' · '+name+(i===1?' ✓':'')+'</b><span>'+[3,17,3,1][i]+' Stimmen</span></div><div class="track"><span style="width:'+[12.5,70.8,12.5,4.2][i]+'%"></span></div></div>').join('')+'</div><p class="result-note">Seine auffälligen Ringe bestehen überwiegend aus Eispartikeln – von winzigen Körnchen bis zu großen Brocken.</p>';const correct=selection===null||selection===1;phone.innerHTML='<div class="center"><div class="big-symbol">'+(correct?'✦':'↗')+'</div><div class="eyebrow">'+(correct?'RICHTIG GERATEN? GEWUSST!':'WEITER GEHT’S')+'</div><h2>'+(correct?'Ring frei.<br>Volltreffer!':'Die nächste<br>gehört dir.')+'</h2><div class="points">'+(correct?'+ 875':'+ 0')+'</div><div>Punkte für diese Frage</div><span class="tag">'+(correct?'Richtig · in 3,2 Sekunden':'Richtig wäre: B · Saturn')+'</span><p class="result-note">'+(correct?'Stark! Du kletterst auf Platz 3.':'Noch sieben Chancen auf dein Comeback.')+'</p></div>'}
if(phase==='ranking'){stage.innerHTML='<div class="eyebrow">ZWISCHENSTAND · NACH FRAGE 3</div><h2>Da geht <span class="highlight">noch was.</span></h2><div class="podium"><div class="winner"><span class="animal">🦊</span><b>Flotter Fuchs</b><small>3.120 Punkte</small><div class="pedestal">2</div></div><div class="winner first"><span class="animal">🦉</span><b>Wilde Eule</b><small>3.260 Punkte</small><div class="pedestal">1</div></div><div class="winner third"><span class="animal">🐨</span><b>Neugieriger Koala</b><small>3.325 Punkte</small><div class="pedestal">3</div></div></div><div class="rank-row"><span>4 · 🐼 Mutiger Panda</span><b>2.980 Punkte</b></div>';stage.querySelector('.winner.first small').textContent='3.890 Punkte';stage.querySelector('.winner:not(.first):not(.third) small').textContent='3.540 Punkte';phone.innerHTML='<div class="center"><div class="eyebrow">DEIN ZWISCHENSTAND</div><div class="big-symbol">3</div><h2>Hallo, Treppchen!</h2><div class="points">3.325</div><div>Punkte insgesamt</div><span class="tag">↑ Einen Platz gutgemacht</span></div><div class="rank-row"><span>2 · 🦊 Flotter Fuchs</span><b>3.540</b></div><div class="rank-row"><span><b>3 · 🐨 Du</b></span><b>3.325</b></div><p class="hint">Gleich kommt die nächste Frage.</p>';if(selection!==null&&selection!==1){phone.innerHTML='<div class="center"><div class="eyebrow">DEIN ZWISCHENSTAND</div><div class="big-symbol">4</div><h2>Alles noch drin.</h2><div class="points">2.450</div><div>Punkte insgesamt</div><span class="tag">Noch sieben Fragen</span><p class="result-note">Gleich kommt die nächste Frage.</p></div>'}}
const isCorrect=selection===null||selection===1;const done=phase==='reveal'||phase==='ranking';root.querySelector('.player small').textContent=done?(isCorrect?'Platz 3 · 3.325 Punkte':'Platz 4 · 2.450 Punkte'):'Platz 4 · 2.450 Punkte';if(phase==='ranking'&&!isCorrect){stage.querySelector('.winner.third .animal').textContent='🐼';stage.querySelector('.winner.third b').textContent='Mutiger Panda';stage.querySelector('.winner.third small').textContent='2.980 Punkte';stage.querySelector('.rank-row').innerHTML='<span>4 · 🐨 Neugieriger Koala</span><b>2.450 Punkte</b>';}root.querySelectorAll('[data-answer]').forEach(b=>b.addEventListener('click',()=>{selection=Number(b.dataset.answer);phase='waiting';render()}));}
root.querySelectorAll('[data-phase]').forEach(b=>b.addEventListener('click',()=>{phase=b.dataset.phase;render()}));render();})();
</script>
</main></body></html>
