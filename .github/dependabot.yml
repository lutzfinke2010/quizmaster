version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      aws:
        patterns: ["@aws-sdk/*", "@aws-amplify/*", "aws-amplify", "aws-cdk*", "@smithy/*"]
      react:
        patterns: ["react", "react-dom", "react-router*", "@types/react*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
