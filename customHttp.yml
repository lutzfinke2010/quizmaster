# Amplify Hosting: HTTP-Header. Wird von Amplify aus dem Repository-Root gelesen.
# connect-src: Die AppSync-API-ID ist je Umgebung verschieden und im Repository nicht bekannt. Deshalb ist nur der
# Subdomain-Teil jokerhaft, Dienst und Region (eu-central-1) sind fest. Nach dem ersten Deployment kann der Platzhalter
# durch den genauen Host aus amplify_outputs.json (data.url) ersetzt werden.
customHeaders:
  - pattern: '**'
    headers:
      - key: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.appsync-api.eu-central-1.amazonaws.com wss://*.appsync-realtime-api.eu-central-1.amazonaws.com https://cognito-idp.eu-central-1.amazonaws.com https://cognito-identity.eu-central-1.amazonaws.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
      - key: Referrer-Policy
        value: no-referrer
      - key: X-Content-Type-Options
        value: nosniff
      - key: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
      # HSTS (S7): bewusst noch aus. Erst aktivieren, wenn die produktive Domain feststeht und dauerhaft per HTTPS
      # erreichbar ist; Amplify-Standarddomains (*.amplifyapp.com) senden HSTS bereits selbst.
      # HSTS erst aktivieren, wenn die produktive Domain feststeht und dauerhaft per HTTPS erreichbar ist.
      # Ohne includeSubDomains und ohne preload:
      # - key: Strict-Transport-Security
      #   value: max-age=31536000
  - pattern: '/admin/**'
    headers:
      - key: X-Robots-Tag
        value: noindex, nofollow
  - pattern: '/play/**'
    headers:
      - key: X-Robots-Tag
        value: noindex, nofollow
  - pattern: '/present/**'
    headers:
      - key: X-Robots-Tag
        value: noindex, nofollow
  # Async-Teilnahmelinks enthalten ein Zugangstoken im Pfad und dürfen nicht indexiert werden.
  - pattern: '/q/**'
    headers:
      - key: X-Robots-Tag
        value: noindex, nofollow
  - pattern: '/join'
    headers:
      - key: X-Robots-Tag
        value: noindex, nofollow
  - pattern: '/join/**'
    headers:
      - key: X-Robots-Tag
        value: noindex, nofollow
