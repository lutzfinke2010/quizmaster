version: 1
backend:
  phases:
    build:
      commands:
        - npm ci --cache .npm --prefer-offline
        - npx ampx pipeline-deploy --branch "$AWS_BRANCH" --app-id "$AWS_APP_ID"
frontend:
  phases:
    build:
      commands:
        - mkdir -p public
        - cp amplify_outputs.json public/amplify_outputs.json
        # Produktiv-Branch: offene Betreiberangaben/Bestätigungen brechen den Build ab (W3).
        - if [ "$AWS_BRANCH" = "${QUIZRUSH_PRODUCTION_BRANCH:-main}" ]; then npm run legal:check -- --strict; else npm run legal:check; fi
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
